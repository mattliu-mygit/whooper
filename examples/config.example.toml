# Whooper's settings. Copy this file to ~/.config/whooper/config.toml (or set WHOOPER_CONFIG to its
# path) and replace every value. Everything that identifies you, your company, or your repos lives
# here, not in the code.

[user]
name = "Sam"                       # how prompts refer to you, as in "the comment as Sam would post it"
github_login = "sam-example"

[github]
orgs = ["example-org"]             # searches, Slack links, and links in drafts stay inside these orgs
# Bot accounts that review PRs. A point one of them already raised does not auto-post again.
review_bots = [
  { login = "ci-review-bot", label = "the CI review bot" },
  { login = "assistant-bot", label = "the coding assistant" },
]

[slack]
workspace_url = "https://example.slack.com"
user_id = "U0000000000"            # your member ID: profile, "...", Copy member ID
ask_channel = "C0000000001"        # where teammates ask you for reviews
summary_channel = "C0000000002"    # a private channel for Whooper's summaries
summary_channel_name = "#whooper"
slackdump_workspace = "example"    # the poll's slackdump login: slackdump workspace new <name>

# The agent each job runs on. agents/ has a folder per agent with a launcher per job it can run.
[jobs]
review = "devin"
poll = "devin"
summary = "devin"

# Each agent's settings. Model names are the agent's own: Devin's names add the effort level.
[agents.claude]
review_model = "claude-opus-5-5"
poll_model = "claude-haiku-5-5"    # also sends the summary
budget_usd = 15                    # the most one review may spend

[agents.devin]
review_model = "claude-opus-5-5-high"
poll_model = "claude-sonnet-5-5-low"

[review]
timeout_minutes = 45               # whooper-review stops a review that runs longer, on any agent
# Skills each review run loads, from ~/.claude/skills. skills/ in this repo has public versions.
skills = ["multi-angle-review", "code-shape-and-runtime-review"]

# One table per repo Whooper reviews. Paths are relative to this file's directory. All three are
# optional: setup and teardown run around each review (see examples/setup.example.sh), and notes
# is Markdown added to the review prompt (see examples/repo-notes.example.md).
[repos."example-org/example-repo"]
setup = "setup.sh"
teardown = "teardown.sh"
notes = "repo-notes.md"
